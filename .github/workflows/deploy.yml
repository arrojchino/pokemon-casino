name: Build and deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'ws://127.0.0.1:8787' }}
      - name: Publish build to repository root for Pages
        run: |
          cp -r frontend/dist/. ./
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f index.html assets
          git commit -m 'Deploy frontend to Pages [skip ci]' || echo 'no changes'
          git push origin HEAD:main
